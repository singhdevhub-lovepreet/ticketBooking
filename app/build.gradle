# 💡 [RYFT REVIEW - SUGGESTION] Consider adding a comment explaining the purpose of the application plugin.
plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
# 💡 [RYFT REVIEW - SUGGESTION] This line is safe, but consider adding a comment explaining why Maven Central is chosen.
    mavenCentral()
}

dependencies {
    // This dependency is used by the application.
# 🚨 [RYFT REVIEW - CRITICAL] libs.guava is not a valid dependency. Consider using a specific version or a group ID.
    implementation libs.guava
# ⚠️ [RYFT REVIEW - WARNING] Consider using a dependency management tool like Gradle's dependency management to avoid version conflicts.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.6'
    implementation 'org.projectlombok:lombok:1.18.22'
# 🚨 [RYFT REVIEW - CRITICAL] jbcrypt is not a recommended library for password hashing. Consider using a more secure library like BCrypt.
    implementation 'org.mindrot:jbcrypt:0.4'

}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use JUnit4 test framework
# ⚠️ [RYFT REVIEW - WARNING] JUnit 4 is deprecated. Consider using JUnit 5 or a different testing framework.
            useJUnit('4.13.2')
        }
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
# 💡 [RYFT REVIEW - SUGGESTION] Java 8 is an older version. Consider using a more recent version like Java 11 or 17.
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

application {
    // Define the main class for the application.
# 💡 [RYFT REVIEW - SUGGESTION] Consider adding a comment explaining why the main class is set to 'ticket.booking.App'.
    mainClass = 'ticket.booking.App'
}
